<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your Expenses</title>
    <meta http-equiv="refresh" content="1; URL='viewExpenses'" />
    <style>
        :root { --bg:#0f172a; --text:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; }
        * { box-sizing:border-box }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family: Inter, system-ui, Arial, sans-serif; }
        .card { padding:1.25rem 1.5rem; border-radius:14px; border:1px solid rgba(148,163,184,.2); background: rgba(2,6,23,.5); box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align:center; }
        .spinner { width:28px; height:28px; border:3px solid rgba(96,165,250,.25); border-top-color: var(--accent); border-radius:50%; animation: spin 1s linear infinite; margin: 0 auto .75rem; }
        @keyframes spin { to { transform: rotate(360deg) } }
        p { margin: .25rem 0 0; color: var(--muted); }
        a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <div>Loading your expenses…</div>
        <p>If not redirected, <a href="viewExpenses">click here</a>.</p>
    </div>
</body>
</html>
